<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
  <title id="title">Leandro Rubio, desarrollador backend</title>
  <desc id="desc">Terminal animada: whoami muestra Leandro Rubio, desarrollador backend PHP y Laravel en Quito; cat experiencia muestra 3 años en soporte técnico; ls proyectos lista elicrochet-ecommerce, clinica-veterinaria y tecnosoluciones.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; font-size: 17px; }
    .prompt { fill: #FBBF24; }
    .cmd { fill: #F9FAFB; }
    .out { fill: #9CA3AF; }
    .hl { fill: #FBBF24; }
    .dir { fill: #60A5FA; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .cursor { fill: #FBBF24; animation: blink 1s step-end infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>

  <!-- Ventana -->
  <rect x="1" y="1" width="818" height="298" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <path d="M1 11 a10 10 0 0 1 10 -10 h798 a10 10 0 0 1 10 10 v25 h-818 z" fill="#1F2937"/>
  <circle cx="24" cy="19" r="6" fill="#F87171"/>
  <circle cx="44" cy="19" r="6" fill="#FBBF24"/>
  <circle cx="64" cy="19" r="6" fill="#34D399"/>
  <text x="410" y="24" text-anchor="middle" class="mono out" font-size="14">leandro@portfolio: ~</text>

  <!-- Cada comando se "escribe" revelando el texto con un rectángulo que crece -->
  <defs>
    <clipPath id="c1"><rect x="40" y="50" height="30" width="0"><animate attributeName="width" from="0" to="120" begin="0.3s" dur="0.6s" fill="freeze" calcMode="discrete" values="0;20;40;60;80;100;120" keyTimes="0;0.16;0.33;0.5;0.66;0.83;1"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="128" height="30" width="0"><animate attributeName="width" from="0" to="240" begin="1.8s" dur="0.9s" fill="freeze" calcMode="discrete" values="0;30;60;90;120;150;180;210;240" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="206" height="30" width="0"><animate attributeName="width" from="0" to="180" begin="3.6s" dur="0.7s" fill="freeze" calcMode="discrete" values="0;30;60;90;120;150;180" keyTimes="0;0.16;0.33;0.5;0.66;0.83;1"/></rect></clipPath>
  </defs>

  <!-- $ whoami -->
  <text x="20" y="72" class="mono prompt">$</text>
  <text x="40" y="72" class="mono cmd" clip-path="url(#c1)">whoami</text>
  <text x="20" y="98" class="mono out line" style="animation-delay:1.1s">Leandro Rubio · <tspan class="hl">desarrollador backend</tspan> (PHP · Laravel) · Quito, EC</text>

  <!-- $ cat experiencia.txt -->
  <text x="20" y="150" class="mono prompt line" style="animation-delay:1.6s">$</text>
  <text x="40" y="150" class="mono cmd" clip-path="url(#c2)">cat experiencia.txt</text>
  <text x="20" y="176" class="mono out line" style="animation-delay:2.9s"><tspan class="hl">3 años</tspan> en soporte técnico → construyo pensando en quien usa el sistema</text>

  <!-- $ ls proyectos/ -->
  <text x="20" y="228" class="mono prompt line" style="animation-delay:3.4s">$</text>
  <text x="40" y="228" class="mono cmd" clip-path="url(#c3)">ls proyectos/</text>
  <text x="20" y="254" class="mono line" style="animation-delay:4.5s"><tspan class="dir">elicrochet-ecommerce/</tspan><tspan class="dir" dx="22">clinica-veterinaria/</tspan><tspan class="dir" dx="22">tecnosoluciones/</tspan></text>

  <!-- Prompt final con cursor -->
  <text x="20" y="282" class="mono prompt line" style="animation-delay:5s">$</text>
  <rect x="40" y="268" width="10" height="18" class="cursor line" style="animation: show 0.01s 5s forwards, blink 1s step-end 5s infinite"/>
</svg>
